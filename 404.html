<style>
:root {
  --noir: #1B1B1B;
  --blanc: #F9F9F9;
  --marron-grise: #735939;
  --gris-pastel: #CCBC9F;
  --gris-clair: #E9E5DE;
  --bg-primary: #E9E5DE;
  --accent: #735939;
  --font: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--noir);
  color: var(--blanc);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* Background pattern */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 80%, rgba(115, 89, 57, 0.18), transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(204, 188, 159, 0.08), transparent 50%);
  pointer-events: none;
}

.error-content {
  position: relative;
  z-index: 1;
  max-width: 560px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.error-logo {
  margin-bottom: 64px;
}
.error-logo svg {
  height: 28px;
  width: auto;
  fill: var(--blanc);
  opacity: 0.85;
}

.error-num {
  font-size: clamp(88px, 14vw, 144px);
  font-weight: 200;
  line-height: 1;
  color: var(--accent);
  letter-spacing: -0.04em;
  margin-bottom: 8px;
  font-feature-settings: "tnum";
}

.error-title {
  font-size: clamp(28px, 3.5vw, 36px);
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: 20px;
  color: var(--blanc);
}

.error-message {
  font-size: 16px;
  line-height: 1.65;
  color: rgba(249, 249, 249, 0.7);
  max-width: 480px;
  margin-bottom: 40px;
}

.error-cta-group {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 26px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-decoration: none;
  transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease;
}
.btn-primary {
  background: var(--accent);
  color: var(--blanc);
  border: 1px solid var(--accent);
}
.btn-primary:hover { background: #5e4830; border-color: #5e4830; transform: translateY(-1px); }

.btn-secondary {
  background: transparent;
  color: var(--blanc);
  border: 1px solid rgba(249, 249, 249, 0.3);
}
.btn-secondary:hover { background: rgba(249, 249, 249, 0.08); border-color: rgba(249, 249, 249, 0.6); }

.error-help {
  margin-top: 56px;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(204, 188, 159, 0.6);
}
.error-help a { color: var(--gris-pastel); text-decoration: none; border-bottom: 1px solid rgba(204, 188, 159, 0.4); padding-bottom: 1px; transition: border-color 0.3s ease; }
.error-help a:hover { border-color: var(--gris-pastel); }
</style>
